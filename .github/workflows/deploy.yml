name: Build, check and deploy to GitHub Pages

# SOW 5.3. Every published change reaches the live URL through this workflow.
# There is no manual upload path and no bolt.diy one-click deploy: pushing to
# main is the only way the site changes, which is what makes the two release
# SHAs an honest record of what is live.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it part-way, so the
# live site is never left mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Install, check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit being released
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        # npm ci installs strictly from package-lock.json and fails if the
        # lockfile and package.json disagree, so the build is reproducible.
        run: npm ci

      - name: Automated check — types
        run: npx tsc -b

      - name: Automated check — unit tests
        # Validation rules are the part of the frontend that can silently rot,
        # so the boundary cases are asserted on every release.
        run: npx vitest run --reporter=verbose

      - name: Resolve the Pages base path
        # A GitHub Pages project site is served from /<repo>/, so Vite needs a
        # matching base. Deriving it from the repository name means renaming or
        # forking the repository needs no code change.
        run: echo "VITE_BASE_PATH=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_ENV"

      - name: Build
        env:
          # Public endpoint, no key attached — a repository variable, not a
          # secret. Settings > Secrets and variables > Actions > Variables.
          VITE_CONTACT_ENDPOINT: ${{ vars.VITE_CONTACT_ENDPOINT }}
        run: npm run build

      - name: Fail if any secret-shaped value reached the bundle
        # A cheap, blunt guard for T5: service-role keys and Windmill tokens
        # must never be in a file the browser downloads.
        run: |
          if grep -rEl 'service_role|eyJhbGciOi|SUPABASE_SERVICE|WINDMILL_TOKEN' dist/; then
            echo "::error::A secret-shaped value was found in dist/. Refusing to publish."
            exit 1
          fi
          echo "No secret-shaped values found in dist/."

      - name: Record what is being released
        run: |
          {
            echo "### Release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit SHA | \`${GITHUB_SHA}\` |"
            echo "| Base path | \`${VITE_BASE_PATH}\` |"
            echo "| Actions run | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on from the workflow itself rather than depending on
          # someone having set Settings > Pages > Source to GitHub Actions.
          # Without this, the very first run fails with "Get Pages site
          # failed ... verify that the repository has Pages enabled", having
          # built nothing — a settings mistake that looks like a code bug.
          enablement: true

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
