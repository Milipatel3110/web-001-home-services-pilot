summary: contact_intake
description: WEB-001. Synchronous intake flow. Called only by the Supabase contact-submit Edge Function
  with a scoped bearer token. Writes one row to public.contact_submissions using a server-side Supabase
  credential, returns the existing row without inserting on a repeated request_id, and always answers
  with an explicit {stored, request_id}.
value:
  modules:
  - id: a
    summary: Store submission (idempotent on request_id)
    value:
      type: rawscript
      language: bun
      content: "/**\n * Windmill flow step — contact_intake / store_submission\n *\n * The single step\
        \ of the synchronous `contact_intake` flow (SOW 5.2).\n * Triggered ONLY by the Supabase Edge\
        \ Function, which authenticates with a\n * scoped bearer token. Nothing else may call it.\n *\n\
        \ * Responsibilities:\n *   1. Write exactly one row to public.contact_submissions using a server-side\n\
        \ *      Supabase credential (service_role, which bypasses RLS).\n *   2. On a repeated request_id,\
        \ return the existing row and add no new row.\n *   3. Return an explicit { stored: true, request_id\
        \ } so the Edge Function can\n *      confirm storage rather than inferring it from an HTTP 200.\n\
        \ *\n * The credential is read from a Windmill resource at run time. It is never\n * committed,\
        \ never logged, and never reaches the browser.\n *\n * This file is the readable source of truth.\
        \ The deployable export is\n * contact_intake.flow.json in the same folder; if you edit this file,\
        \ update\n * the embedded copy there too (scripts/sync-windmill-flow.mjs does it for you).\n */\n\
        import * as wmill from 'windmill-client'\n\n// Paths to look for the Windmill resource holding\
        \ the Supabase admin\n// credential, tried in order. Windmill puts things under f/<folder>/ or\n\
        // u/<user>/ depending on how they were created, and which one you get is a\n// detail of the\
        \ UI rather than a decision anyone makes, so both are accepted.\n// Add your own path to the front\
        \ of this list if it differs.\nconst RESOURCE_PATHS = [\n  'u/mili/f/web001/supabase_admin',\n\
        \  'f/web001/supabase_admin',\n  'u/mili/supabase_admin',\n  'f/web001/supabase',\n  'u/mili/supabase',\n\
        ]\n\nconst TABLE = 'contact_submissions'\n\ntype SupabaseAdminResource = {\n  url?: string\n \
        \ key?: string\n  service_role_key?: string\n  serviceRoleKey?: string\n}\n\ntype StoredRow =\
        \ {\n  request_id: string\n  created_at: string\n}\n\nexport async function main(\n  request_id:\
        \ string,\n  name: string,\n  email: string,\n  message: string,\n): Promise<{\n  stored: true\n\
        \  request_id: string\n  duplicate: boolean\n  created_at: string\n}> {\n  // ---- Credential\
        \ ----------------------------------------------------------\n  let resource: SupabaseAdminResource\
        \ | undefined\n  let resourcePath = ''\n  for (const candidate of RESOURCE_PATHS) {\n    try {\n\
        \      const found = (await wmill.getResource(candidate)) as SupabaseAdminResource\n      if (found\
        \ && (found.url || found.key)) {\n        resource = found\n        resourcePath = candidate\n\
        \        break\n      }\n    } catch {\n      // Not at this path. Try the next one.\n    }\n\
        \  }\n\n  const baseUrl = (resource?.url ?? '').replace(/\\/+$/, '')\n  const serviceKey =\n \
        \   resource?.service_role_key ?? resource?.serviceRoleKey ?? resource?.key ?? ''\n\n  if (!baseUrl\
        \ || !serviceKey) {\n    // Thrown, not returned. A thrown error fails the Windmill job, the Edge\n\
        \    // Function sees a non-success result, and the visitor is told truthfully\n    // that nothing\
        \ was saved. The message names the paths tried, because a\n    // misplaced resource is the likeliest\
        \ reason to land here.\n    throw new Error(\n      resourcePath\n        ? `Supabase resource\
        \ at ${resourcePath} is missing its url or key.`\n        : `No Supabase resource found. Looked\
        \ in: ${RESOURCE_PATHS.join(', ')}. ` +\n          `Add your resource's path to RESOURCE_PATHS\
        \ at the top of this script.`,\n    )\n  }\n\n  // ---- Re-validate ---------------------------------------------------------\n\
        \  // The Edge Function already validated. This flow is reachable only by that\n  // function,\
        \ but it refuses to be the component that trusts its caller.\n  const trimmedName = String(name\
        \ ?? '').trim()\n  const trimmedEmail = String(email ?? '').trim()\n  const trimmedMessage = String(message\
        \ ?? '').trim()\n  const uuidRe =\n    /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i\n\
        \n  if (!uuidRe.test(String(request_id ?? ''))) {\n    throw new Error('Invalid request_id.')\n\
        \  }\n  if (trimmedName.length < 2 || trimmedName.length > 80) {\n    throw new Error('Invalid\
        \ name length.')\n  }\n  if (trimmedEmail.length < 3 || trimmedEmail.length > 254) {\n    throw\
        \ new Error('Invalid email length.')\n  }\n  if (trimmedMessage.length < 10 || trimmedMessage.length\
        \ > 1000) {\n    throw new Error('Invalid message length.')\n  }\n\n  const headers = {\n    apikey:\
        \ serviceKey,\n    Authorization: `Bearer ${serviceKey}`,\n    'Content-Type': 'application/json',\n\
        \  }\n\n  // ---- Insert, ignoring an existing request_id -----------------------------\n  //\
        \ resolution=ignore-duplicates means a repeat of the same request_id is a\n  // no-op at the database:\
        \ no second row, no error. The response is an empty\n  // array in that case, which is how we\
        \ detect the duplicate.\n  const insertResponse = await fetch(\n    `${baseUrl}/rest/v1/${TABLE}?on_conflict=request_id`,\n\
        \    {\n      method: 'POST',\n      headers: {\n        ...headers,\n        Prefer: 'resolution=ignore-duplicates,return=representation',\n\
        \      },\n      body: JSON.stringify({\n        request_id,\n        name: trimmedName,\n   \
        \     email: trimmedEmail,\n        message: trimmedMessage,\n      }),\n    },\n  )\n\n  if (!insertResponse.ok)\
        \ {\n    const detail = await insertResponse.text()\n    // Log the status and PostgREST error\
        \ code only. The submitted fields are\n    // never written to the job log (SOW 5.2 redaction).\n\
        \    throw new Error(\n      `Supabase insert failed with ${insertResponse.status}: ${summarise(detail)}`,\n\
        \    )\n  }\n\n  const inserted = (await insertResponse.json()) as StoredRow[]\n\n  if (Array.isArray(inserted)\
        \ && inserted.length === 1) {\n    return {\n      stored: true,\n      request_id: inserted[0].request_id,\n\
        \      duplicate: false,\n      created_at: inserted[0].created_at,\n    }\n  }\n\n  // ---- Duplicate:\
        \ return the existing row, add nothing ---------------------\n  const existingResponse = await\
        \ fetch(\n    `${baseUrl}/rest/v1/${TABLE}?request_id=eq.${encodeURIComponent(request_id)}&select=request_id,created_at`,\n\
        \    { method: 'GET', headers },\n  )\n\n  if (!existingResponse.ok) {\n    const detail = await\
        \ existingResponse.text()\n    throw new Error(\n      `Supabase lookup failed with ${existingResponse.status}:\
        \ ${summarise(detail)}`,\n    )\n  }\n\n  const existing = (await existingResponse.json()) as\
        \ StoredRow[]\n\n  if (!Array.isArray(existing) || existing.length !== 1) {\n    // Neither inserted\
        \ nor found: the write did not happen. Fail loudly so the\n    // visitor is not told their enquiry\
        \ was recorded.\n    throw new Error('Submission was neither inserted nor found; storage unconfirmed.')\n\
        \  }\n\n  return {\n    stored: true,\n    request_id: existing[0].request_id,\n    duplicate:\
        \ true,\n    created_at: existing[0].created_at,\n  }\n}\n\n/** Keep error logs short and free\
        \ of any echoed submission content. */\nfunction summarise(detail: string): string {\n  try {\n\
        \    const parsed = JSON.parse(detail) as { code?: string; message?: string }\n    return parsed.code\
        \ ? `code=${parsed.code}` : (parsed.message ?? '').slice(0, 120)\n  } catch {\n    return detail.slice(0,\
        \ 120)\n  }\n}\n"
      input_transforms:
        request_id:
          type: javascript
          expr: flow_input.request_id
        name:
          type: javascript
          expr: flow_input.name
        email:
          type: javascript
          expr: flow_input.email
        message:
          type: javascript
          expr: flow_input.message
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  required:
  - request_id
  - name
  - email
  - message
  order:
  - request_id
  - name
  - email
  - message
  properties:
    request_id:
      type: string
      description: Client-generated UUID. The idempotency key for this enquiry.
      format: uuid
    name:
      type: string
      description: Submitted name, 2-80 characters.
    email:
      type: string
      description: Submitted email, up to 254 characters.
    message:
      type: string
      description: Submitted message, 10-1000 characters.
